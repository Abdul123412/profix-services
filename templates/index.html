<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProFix - Trusted Workers</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#2e7d32;color:white;padding:20px;text-align:center}
.container{max-width:600px;margin:20px auto;padding:0 15px}
.job-card{background:white;margin-bottom:10px;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1);overflow:hidden}
.job-header{padding:18px 20px;display:flex;justify-content:space-between;cursor:pointer;font-weight:bold}
.worker-list{display:none;padding:10px 20px;background:#fafafa;border-top:1px solid #eee}
.worker-list.active{display:block}
.worker{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.btns{display:flex;gap:8px}
.btn{text-decoration:none;padding:8px 14px;border-radius:20px;font-size:13px;color:white;font-weight:bold}
.btn-call{background:#2e7d32}
.btn-wa{background:#25D366}
.count{background:#2e7d32;color:white;padding:3px 10px;border-radius:20px;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="header"><h1>ProFix Services</h1><p>Tap a category to see workers</p></div>
<div class="container">
{% for job, workers_list in jobs.items() %}
<div class="job-card">
<div class="job-header" onclick="this.nextElementSibling.classList.toggle('active')"><div>🔧 {{ job }} <span class="count">{{ workers_list|length }}</span></div><div>▶</div></div>
<div class="worker-list">
{% for worker in workers_list %}
<div class="worker">
<div><strong>{{ worker.name }}</strong><br><small>⭐ {{ worker.rating }} • Koforidua</small></div>
<div class="btns">
<a class="btn btn-call" href="tel:+233506351995">📞 Call</a>
<a class="btn btn-wa" href="https://wa.me/233506351995?text=Hello%20ProFix%2C%20I%20need%20{{ worker.name }}%20for%20{{ job }}">WhatsApp</a>
</div>
</div>
{% endfor %}
</div>
</div>
{% endfor %}
</div>
</body>
</html>
